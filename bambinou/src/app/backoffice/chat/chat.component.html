<body>
    <div class="wrapper">
      <!-- Sidebar -->
      <app-sidebar></app-sidebar>

      <!-- End Sidebar -->

      <div class="main-panel">
        <div class="main-header">
          <div class="main-header-logo">
            <!-- Logo Header -->
            <div class="logo-header" data-background-color="dark">
              <a href="index.html" class="logo">
                <img
                  src="assets/img/kaiadmin/logo_light.svg"
                  alt="navbar brand"
                  class="navbar-brand"
                  height="20"
                />
              </a>
              <div class="nav-toggle">
                <button class="btn btn-toggle toggle-sidebar">
                  <i class="gg-menu-right"></i>
                </button>
                <button class="btn btn-toggle sidenav-toggler">
                  <i class="gg-menu-left"></i>
                </button>
              </div>
              <button class="topbar-toggler more">
                <i class="gg-more-vertical-alt"></i>
              </button>
            </div>
            <!-- End Logo Header -->
          </div>
          <!-- Navbar Header -->
          <app-backoffice-navbar></app-backoffice-navbar>

          <!-- End Navbar -->
        </div>

        <div class="container">
          <div class="page-inner">
            <div
              class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4"
            >
              <div>
                <h3 class="fw-bold mb-3">Chat</h3>
                <h6 class="op-7 mb-2">Welcome to Bambino's Chat Section</h6>
              </div>
              <!-- <div class="ms-md-auto py-2 py-md-0">
                <a [routerLink]="['/backoffice/user']" class="btn btn-label-info btn-round me-2">Manage</a>
                <a [routerLink]="['/backoffice/user/add']" class="btn btn-primary btn-round">Add User</a>
              </div> -->
            </div>
           
            
            
                <div class="row">
                    <div class="col-md-4" style="width:300px;">
                     
                      <div class="card card-round">
                        <div class="card-body">
                          <div class="card-title fw-mediumbold">Chats</div>
                          <div class="card-list">
                            <div class="item-list" *ngFor="let conv of listConversation" (click)="setconversation(conv.idConversation)"  (contextmenu)="onRightClick($event, conv)" style="cursor: pointer;">
                              <div class="avatar">
                                <img src="../../../assets/BackOffice/assets/img/cercle-bleu-utilisateur-blanc_78370-4707.avif" alt="..." class="avatar-img rounded-circle">
                              </div>
                              <div  class="info-user ms-3">
                                <div class="username" *ngFor="let user of conv.users">{{user.name}}</div> 
                                <div class="status"></div>
                              </div>
                              <!-- <button class="btn btn-icon btn-primary btn-round btn-xs" (click)="removeconversation(conv.idConversation)">
                                <i class="fas fa-trash-alt"></i>
                              </button>
                              <button class="btn btn-icon btn-primary btn-round btn-xs" (click)="setconversation(conv.idConversation)">
                                <i class="fa fa-plus"></i>
                              </button> -->
                              <!-- Menu contextuel personnalisé -->
                              <!-- Menu contextuel personnalisé -->
                              <div
                              class="custom-context-menu"
                              *ngIf="contextMenuVisible"
                              [ngStyle]="{ top: contextMenuPosition.y + 'px', left: contextMenuPosition.x + 'px' }"
                              (click)="deleteConversation(selectedConv)"
                              >&nbsp;
                              Supprimer 🚨
                              </div>
                            </div>
                           
                           
                          </div>
                        </div>
                      </div>
                      <div class="card card-info card-annoucement card-round">
                        <div class="card-body text-center">
  
                          <div class="card-opening">Welcome <span style="font-weight: bold;">{{CurrentName}}</span></div>
                          <div class="card-desc">
                            <img src="../../../assets/BackOffice/assets/img/discussion.avif" alt="" style="width:220px; border-radius: 20px;">

                          </div>
                          <!-- <div class="card-detail">
                            <div class="btn btn-light btn-rounded">View Detail</div>
                          </div> -->
                        </div>
                      </div>
                    </div>
                    <div class="col-md-4" style="width: 900px; ">
                        <div class="card card-chat card-round" style="height: 500px;">
                          <!-- bg-primary -->
                          <div class="card-header  text-white text-center" style="border-radius: 15px 15px 0px 0px;" [ngStyle]="{'background-color':couleur}">
                            <h5 style="color: white;"><span style="font-weight: bold;">Discussion </span></h5>
                          </div>
                          <div class="card-body chat-box" style="height: 300px; overflow-y: auto;">
                            <div class="message " *ngFor="let message of listMessage" [ngClass]="{'sent': message.sender.id === User.id, 'received': message.sender.id !== User.id}">
                                <p><strong>{{message.sender.name}}:</strong> {{message.message}}</p>
                              </div>
                            <!-- Messages affichés ici -->
                            <!-- <div class="message received" *ngFor="let message of listMessageRecu">
                              <p><strong>Joko Subianto:</strong> {{message.message}}</p>
                            </div>
                            <div class="message sent text-end" *ngFor="let messagee of listMessageEnvoye">
                              <p ><strong>Moi:</strong> {{messagee.message}}</p>
                            </div> -->
                            
                          </div>
                          <div class="card-footer">
                            <div class="input-group">
                                <form [formGroup]="MessageForm" action="">
                              <input type="text" class="form-control" placeholder="Écrire un message..." id="messageInput" formControlName="message">
                              <button class="btn btn-primary" (click)="sendMessage()" type="submit">Envoyer</button>
                            </form>
                            </div>
                          </div>
                        </div>
                      </div>
                  
                  </div>

                  
                  <div class="row">

                <div class="col-md-4" >
                <div class="card card-round">
                  <div class="card-body">
                    <div class="card-head-row card-tools-still-right">
                      <div class="card-title">Start Conversation</div>
                      <div class="card-tools">
                        <div class="dropdown">
                          <button class="btn btn-icon btn-clean me-0" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <i class="fas fa-ellipsis-h"></i>
                          </button>
                          <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                            <a class="dropdown-item" href="#">Action</a>
                            <a class="dropdown-item" href="#">Another action</a>
                            <a class="dropdown-item" href="#">Something else here</a>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="card-list py-4" style="max-height: 400px; overflow-y: auto;">
                      <div class="item-list d-flex align-items-center mb-3" *ngFor="let user of listUsers">
                        <div class="avatar">
                          <img src="../../../assets/BackOffice/assets/img/cercle-bleu-utilisateur-blanc_78370-4707.avif"
                               alt="..." class="avatar-img rounded-circle">
                        </div>
                        <div class="info-user ms-3">
                          <div class="username">{{user.name}}</div>
                          <div class="status">{{user.email}}</div>
                        </div>
                        <button class="btn btn-icon btn-link op-8 me-1" (click)="createConversation(user.id)">
                          <i class="far fa-envelope"></i>
                        </button>
                        <button class="btn btn-icon btn-link btn-danger op-8">
                          <i class="fas fa-ban"></i>
                        </button>
                      </div>
                    </div>
                    
                  </div>
                </div>
               

                
              </div>
                  </div>
            

           
          </div>

        </div>


        <app-backoffice-footer></app-backoffice-footer>

      </div>
