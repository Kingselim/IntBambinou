<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Dashboard</title>
    <meta content="width=device-width, initial-scale=1.0, shrink-to-fit=no" name="viewport" />
    <link rel="icon" href="assets/img/kaiadmin/favicon.ico" type="image/x-icon" />

    <!-- Fonts and icons -->
    <!-- <script src="assets/js/plugin/webfont/webfont.min.js"></script> -->
    <script>
        WebFont.load({
            google: { families: ["Public Sans:300,400,500,600,700"] },
            custom: {
                families: [
                    "Font Awesome 5 Solid",
                    "Font Awesome 5 Regular",
                    "Font Awesome 5 Brands",
                    "simple-line-icons",
                ],
                urls: ["assets/css/fonts.min.css"],
            },
            active: function () {
                sessionStorage.fonts = true;
            },
        });
    </script>

    <!-- CSS Files -->
    <!-- <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/plugins.min.css" />
    <link rel="stylesheet" href="assets/css/kaiadmin.min.css" /> -->

    <!-- CSS Just for demo purpose, don't include it in your project -->
    <!-- <link rel="stylesheet" href="assets/css/demo.css" /> -->

    <style>
        .bouttonblocked{
            cursor: pointer;
            color: red;
            padding: 0;
            margin: 0;

        }
        .bouttonblocked:hover{
            color: green;
        }


        .bouttonactive{
            cursor: pointer;
            color: green;
            margin: 0;

        }
        .bouttonactive:hover{
            color: red;
        }

        .bouttondelete{
            cursor: pointer;
            color: blue;
            margin: 0;
            padding: 0;
           
        }
        .bouttondelete:hover{
            color: red;
        }

        .bouttonanalysis{
            cursor: pointer;
            color: orange;
            margin: 0;

        }
        .bouttonanalysis:hover{
            color: orangered;
        }

    </style>
</head>



<body>
    <div class="wrapper">
        <!-- Sidebar -->
         <app-sidebar></app-sidebar>
        <!-- End Sidebar -->

        <div class="main-panel">
            <div class="main-header">
                <div class="main-header-logo">
                    <!-- Logo Header -->
                    <div class="logo-header" data-background-color="dark">
                        <a href="index.html" class="logo">
                            <img src="assets/img/kaiadmin/logo_light.svg" alt="navbar brand" class="navbar-brand"
                                height="20" />
                        </a>
                        <div class="nav-toggle">
                            <button class="btn btn-toggle toggle-sidebar">
                                <i class="gg-menu-right"></i>
                            </button>
                            <button class="btn btn-toggle sidenav-toggler">
                                <i class="gg-menu-left"></i>
                            </button>
                        </div>
                        <button class="topbar-toggler more">
                            <i class="gg-more-vertical-alt"></i>
                        </button>
                    </div>
                    <!-- End Logo Header -->
                </div>
                <!-- Navbar Header -->
                <app-backoffice-navbar></app-backoffice-navbar>
                <!-- End Navbar -->
            </div>

            <div class="container">
                <div class="page-inner">
                    <div class="d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-4">
                        <div>
                            <h3 class="fw-bold mb-3">User List</h3>
                            <!-- <h6 class="op-7 mb-2">Free Bootstrap 5 Admin Dashboard</h6> -->
                        </div>
                        <div class="ms-md-auto py-2 py-md-0">
                            <!-- <a href="#" class="btn btn-label-info btn-round me-2">Manage</a> -->
                            <a [routerLink]="['add']" class="btn btn-primary btn-round">Add User</a>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <div class="card card-round">
                                <div class="card-header">
                                    <div class="card-head-row card-tools-still-right">
                                      
                                          
                                        <div class="col-md-6">
                                            <div class="search-container">
                                                <input type="text" placeholder="Search with name" [(ngModel)]="searchTerm" />

                                                <select [(ngModel)]="selectedRole">
                                                    <option value="">Filter with roles</option>
                                                    <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
                                                  </select>
                                              </div>
                                        <!-- <h4 class="card-title">Users List {{ CurrentEmail }}</h4>
                                        <div class="card-tools">
                                            <button class="btn btn-icon btn-link btn-primary btn-xs">
                                                <span class="fa fa-angle-down"></span>
                                            </button>
                                            <button class="btn btn-icon btn-link btn-primary btn-xs btn-refresh-card">
                                                <span class="fa fa-sync-alt"></span>
                                            </button>
                                            <button class="btn btn-icon btn-link btn-primary btn-xs">
                                                <span class="fa fa-times"></span>
                                            </button>
                                        </div> -->
                                    </div>
                                    <!-- <p class="card-category">
                                      Here the list of users
                                    </p> -->
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                       
                                            <div class="table-responsive table-hover table-sales">
                                                <table class="table">
                                                    <tbody>
                                                        <tr>
                                                        <td> &nbsp;</td>
                                                        <!-- <td>ID</td> -->
                                                        <td>Name</td>
                                                        <td>Age</td>
                                                        <td>Email</td>
                                                        <td>Role</td>
                                                        <!-- <td>Password</td> -->
                                                        <td>Status</td>
                                                        <!-- <td>Delete</td> -->
                                                        </tr>
                                                        <tr *ngFor="let user of filteredUsers">
                                                            <td>
                                                                <div *ngIf="user.image" class="flag">
                                                                  <a [routerLink]="['detail/',user.id]">
                                                                    <img  src="http://localhost:8089/images/{{user.image}}" alt="userimage" style="width: 80px; border-radius: 90px;"  />

                                                                      </a>
                                                                </div>
                                                                <div *ngIf="user.image == null" class="flag">
                                                                    <a [routerLink]="['detail/',user.id]">
                                                                        <img  src="../../../assets/BackOffice/assets/img/cercle-bleu-utilisateur-blanc_78370-4707.avif" alt="userimage" style="width: 70px;"  />

                                                                        </a>
                                                                </div>
                                                            </td>
                                                            <!-- <td>{{user.id}}</td> -->
                                                            <td>{{user.name}}</td>
                                                            <td>{{user.age}}</td>
                                                            <td>{{user.email}}</td>
                                                            <!-- <td>{{user.password}}</td> -->
                                                            <td>{{user.roleTypes[0].role}}</td>
                                                            <td *ngIf="user.status === 0" > <p (click)="ActivateUser(user.id)"class="bouttonblocked">Blocked</p></td>
                                                            <td *ngIf="user.status == 1"><p (click)="BlockUser(user.id)" class="bouttonactive">Active</p></td>
                                                            <td *ngIf="user.status == 2"><p (click)="BlockUser(user.id)" class="bouttonanalysis">Analysis</p></td>
                                                           
                                                            <!-- <td class="text-end" (click)="deleteUser(user.id)" > <p class="bouttondelete">Delete </p> </td> -->
                                                            <td> &nbsp;</td>

                                                        </tr>

                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mapcontainer">
                                                <div id="world-map" class="w-100" style="height: 300px"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                </div>
            </div>


            <app-backoffice-footer></app-backoffice-footer>

        </div>

        <!-- Custom template | don't include it in your project! -->
        <div class="custom-template">
            <div class="title">Settings</div>
            <div class="custom-content">
                <div class="switcher">
                    <div class="switch-block">
                        <h4>Logo Header</h4>
                        <div class="btnSwitch">
                            <button type="button" class="selected changeLogoHeaderColor" data-color="dark"></button>
                            <button type="button" class="changeLogoHeaderColor" data-color="blue"></button>
                            <button type="button" class="changeLogoHeaderColor" data-color="purple"></button>
                            <button type="button" class="changeLogoHeaderColor" data-color="light-blue"></button>
                            <button type="button" class="changeLogoHeaderColor" data-color="green"></button>
                            <button type="button" class="changeLogoHeaderColor" data-color="orange"></button>
                            <button type="button" class="changeLogoHeaderColor" data-color="red"></button>
                            <button type="button" class="changeLogoHeaderColor" data-color="white"></button>
                            <br />
                            <button type="button" class="changeLogoHeaderColor" data-color="dark2"></button>
                            <button type="button" class="changeLogoHeaderColor" data-color="blue2"></button>
                            <button type="button" class="changeLogoHeaderColor" data-color="purple2"></button>
                            <button type="button" class="changeLogoHeaderColor" data-color="light-blue2"></button>
                            <button type="button" class="changeLogoHeaderColor" data-color="green2"></button>
                            <button type="button" class="changeLogoHeaderColor" data-color="orange2"></button>
                            <button type="button" class="changeLogoHeaderColor" data-color="red2"></button>
                        </div>
                    </div>
                    <div class="switch-block">
                        <h4>Navbar Header</h4>
                        <div class="btnSwitch">
                            <button type="button" class="changeTopBarColor" data-color="dark"></button>
                            <button type="button" class="changeTopBarColor" data-color="blue"></button>
                            <button type="button" class="changeTopBarColor" data-color="purple"></button>
                            <button type="button" class="changeTopBarColor" data-color="light-blue"></button>
                            <button type="button" class="changeTopBarColor" data-color="green"></button>
                            <button type="button" class="changeTopBarColor" data-color="orange"></button>
                            <button type="button" class="changeTopBarColor" data-color="red"></button>
                            <button type="button" class="selected changeTopBarColor" data-color="white"></button>
                            <br />
                            <button type="button" class="changeTopBarColor" data-color="dark2"></button>
                            <button type="button" class="changeTopBarColor" data-color="blue2"></button>
                            <button type="button" class="changeTopBarColor" data-color="purple2"></button>
                            <button type="button" class="changeTopBarColor" data-color="light-blue2"></button>
                            <button type="button" class="changeTopBarColor" data-color="green2"></button>
                            <button type="button" class="changeTopBarColor" data-color="orange2"></button>
                            <button type="button" class="changeTopBarColor" data-color="red2"></button>
                        </div>
                    </div>
                    <div class="switch-block">
                        <h4>Sidebar</h4>
                        <div class="btnSwitch">
                            <button type="button" class="changeSideBarColor" data-color="white"></button>
                            <button type="button" class="selected changeSideBarColor" data-color="dark"></button>
                            <button type="button" class="changeSideBarColor" data-color="dark2"></button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="custom-toggle">
                <i class="icon-settings"></i>
            </div>
        </div>
        <!-- End Custom template -->
    </div>
    <!--   Core JS Files   -->
    <!-- <script src="assets/js/core/jquery-3.7.1.min.js"></script>
    <script src="assets/js/core/popper.min.js"></script>
    <script src="assets/js/core/bootstrap.min.js"></script> -->

    <!-- jQuery Scrollbar -->
    <!-- <script src="assets/js/plugin/jquery-scrollbar/jquery.scrollbar.min.js"></script> -->

    <!-- Chart JS -->
    <!-- <script src="assets/js/plugin/chart.js/chart.min.js"></script> -->

    <!-- jQuery Sparkline -->

    <!-- Chart Circle -->

    <!-- Datatables -->
    <!-- <script src="assets/js/plugin/datatables/datatables.min.js"></script> -->

    <!-- Bootstrap Notify -->
    <!-- <script src="assets/js/plugin/bootstrap-notify/bootstrap-notify.min.js"></script> -->

    <!-- jQuery Vector Maps -->
    <!-- <script src="assets/js/plugin/jsvectormap/jsvectormap.min.js"></script>
    <script src="assets/js/plugin/jsvectormap/world.js"></script> -->

    <!-- Sweet Alert -->

    <script>
        $("#lineChart").sparkline([102, 109, 120, 99, 110, 105, 115], {
            type: "line",
            height: "70",
            width: "100%",
            lineWidth: "2",
            lineColor: "#177dff",
            fillColor: "rgba(23, 125, 255, 0.14)",
        });

        $("#lineChart2").sparkline([99, 125, 122, 105, 110, 124, 115], {
            type: "line",
            height: "70",
            width: "100%",
            lineWidth: "2",
            lineColor: "#f3545d",
            fillColor: "rgba(243, 84, 93, .14)",
        });

        $("#lineChart3").sparkline([105, 103, 123, 100, 95, 105, 115], {
            type: "line",
            height: "70",
            width: "100%",
            lineWidth: "2",
            lineColor: "#ffa534",
            fillColor: "rgba(255, 165, 52, .14)",
        });
    </script>
</body>
